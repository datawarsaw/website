<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 233 124" width="233" height="124" role="img" aria-labelledby="waMonogramTitle" aria-describedby="waMonogramDesc">
  <title id="waMonogramTitle">Warsaw Analytica monogram</title>
  <desc id="waMonogramDesc">Overlapping W and A monogram: deep-teal strokes, a narrow muted-lime diagonal, and charcoal strokes with serif terminals.</desc>

  <!--
    Warsaw Analytica - WA monogram (canonical Brand v1 asset)
    Owner-approved as canonical Warsaw Analytica Digital Brand v1 (2026-09-15).
    Reconstructed from the approved brandboard: docs/brand/brand-reference.png
    Source region on the board: x 42..275, y 167.5..291.5 (233 x 124 px)
    Local coordinate system: source pixel minus (42, 167.5) -> viewBox 0 0 233 124

    Draw order matches the approved reference:
      1. deep teal strokes (#0F4D4A)
      2. narrow muted-lime diagonal (#C7D39B)
      3. charcoal strokes (#1F2421)

    The teal group contains two paths that form one continuous stroke; the
    muted-lime diagonal crosses it, and the reference shows the lime above the
    teal. Keep that order if the lime is edited.
  -->

  <!-- 1. Deep teal strokes -->
  <g fill="#0F4D4A">
    <!-- middle teal stroke, upper half (continues as the next path) -->
    <path d="M123 24 L113 38 L112 43 L125 76 L136 54 L125 24 Z"/>
    <!-- middle teal stroke, lower half, ending in its bottom serif -->
    <path d="M137 62 L128 83 L140 118 L140 122 L137 124 L167 124 L162 122 L160 119 L138 62 Z"/>
    <!-- right teal stroke with bottom serif -->
    <path d="M164 12 L161 26 L160 28 L154 30 L154 33 L188 116 L188 120 L186 122 L172 124 L233 124 L217 123 L211 120 L165 12 Z"/>
  </g>

  <!-- 2. Narrow muted-lime diagonal -->
  <g fill="#C7D39B">
    <path d="M151 19 L112 111 L107 121 L103 123 L108 124 L112 123 L114 113 L120 102 L123 92 L127 86 L139 53 L154 22 L152 19 Z"/>
  </g>

  <!-- 3. Charcoal strokes -->
  <g fill="#1F2421">
    <!-- left stem with top serif, tapering to a point at the baseline -->
    <path d="M0 0 L17 1 L23 5 L73 123 L75 123 L82 109 L84 99 L46 11 L46 4 L48 2 L65 0 Z"/>
    <!-- middle charcoal wedge with top serif -->
    <path d="M79 0 L96 3 L111 42 L120 27 L125 23 L120 8 L121 4 L123 2 L141 0 Z"/>
    <!-- thin charcoal hairline -->
    <path d="M161 6 L152 25 L153 31 L160 28 L161 26 L162 17 L164 13 L163 6 Z"/>
  </g>
</svg>
